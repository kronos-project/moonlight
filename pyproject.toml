[tool.poetry]
name = "moonlight"
version = "0.4.1"
description = "Wizard101 traffic decoder"
authors = ["Ethan Zeigler <ethanzeigler@gmail.com>", "Kronos Authors <>"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/kronos-project/moonlight"
include = [
    "moonlight",
    "test",
    "poetry.lock",
    "pyproject.toml"
]

[tool.poetry.dependencies]
python = ">=3.12,<4"
# https://github.com/secdev/scapy/issues/3246 fix isn't on pypi
printrospector = {git = "https://gitlab.com/vale_/printrospector", rev = "main"}
katsuba = {git = "https://github.com/vbe0201/katsuba.git", rev = "36e296f6c6ab21459edbd61d8ba333c950e9ac44", subdirectory = "src/katsuba-py"}
click = "^8.0.4"
colorama = "^0.4.4"
scapy = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "^26.3.1"
pre-commit = "^2.17.0"
ipython = "^8.10.0"
ipykernel = "^6.9.2"
snakeviz = "^2.1.1"
pyright = "^1.1.326"

[tool.poetry.scripts]
moonlight = "moonlight.__main__:cli_cmd"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "line-too-long", # We'll let black handle this. There are cases when long lines are okay.
]

[tool.pyright]
include = ["mooonlight"]
